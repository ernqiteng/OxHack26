# Tempo dashboard theme, in the style of grid.iamkate.com (National Grid: Live): near-black page, #222 panels
# with #444 header strips, Proza Libre throughout, green links. Fonts are self-hosted from
# tempo/dashboard/static so the venue Wi-Fi cannot block them. Tokens mirror tempo/dashboard/theme.py.
[theme]
base = "dark"
primaryColor = "#55bb55"
backgroundColor = "#111111"
secondaryBackgroundColor = "#222222"
textColor = "#eeeeee"
linkColor = "#88cc88"
borderColor = "#444444"
dataframeBorderColor = "#333333"
dataframeHeaderBackgroundColor = "#444444"
codeBackgroundColor = "#181818"
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = false
showSidebarBorder = false
font = "Proza Libre"
headingFont = "Proza Libre"
codeFont = "IBM Plex Mono"
baseFontSize = 17
headingFontSizes = ["2.75rem", "2rem", "1.5rem", "1.15rem", "1rem", "0.9rem"]
headingFontWeights = [400, 400, 400, 500, 500, 500]
chartCategoricalColors = ["#99dd55", "#ee9944", "#33aadd", "#666666"]
greenColor = "#55bb55"
redColor = "#cc4455"
orangeColor = "#ee9944"
blueColor = "#33aadd"
grayColor = "#888888"

[[theme.fontFaces]]
family = "Proza Libre"
url = "app/static/ProzaLibre-Regular.woff2"
weight = 400
[[theme.fontFaces]]
family = "Proza Libre"
url = "app/static/ProzaLibre-Medium.woff2"
weight = 500
[[theme.fontFaces]]
family = "Proza Libre"
url = "app/static/ProzaLibre-SemiBold.woff2"
weight = 600
[[theme.fontFaces]]
family = "Proza Libre"
url = "app/static/ProzaLibre-Italic.woff2"
weight = 400
style = "italic"
[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/IBMPlexMono-Regular.woff2"
weight = 400

[server]
enableStaticServing = true
headless = true

[browser]
gatherUsageStats = false

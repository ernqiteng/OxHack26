# Tempo dashboard theme: docs/ui-plan.md section 5.1 (paper surface, serif headings, Plex body and mono).
# Fonts are self-hosted from tempo/dashboard/static so the venue Wi-Fi cannot block them.
[theme]
base = "light"
primaryColor = "#1a4d3e"
backgroundColor = "#fafaf8"
secondaryBackgroundColor = "#f5f5f0"
textColor = "#1c1917"
linkColor = "#1a4d3e"
borderColor = "#d6d3d1"
dataframeBorderColor = "#e7e5e4"
dataframeHeaderBackgroundColor = "#f5f5f0"
codeBackgroundColor = "#f0f0ea"
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
font = "IBM Plex Sans"
headingFont = "Libre Baskerville"
codeFont = "IBM Plex Mono"
baseFontSize = 16
headingFontSizes = ["2.25rem", "1.875rem", "1.5rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [700, 700, 700, 600, 600, 600]
chartCategoricalColors = ["#1f8a5a", "#c2410c", "#2563eb", "#a8a29e"]
greenColor = "#15803d"
redColor = "#991b1b"
orangeColor = "#92400e"
blueColor = "#1e40af"
grayColor = "#78716c"

[[theme.fontFaces]]
family = "Libre Baskerville"
url = "app/static/LibreBaskerville-Regular.woff2"
weight = 400
[[theme.fontFaces]]
family = "Libre Baskerville"
url = "app/static/LibreBaskerville-Bold.woff2"
weight = 700
[[theme.fontFaces]]
family = "Libre Baskerville"
url = "app/static/LibreBaskerville-Italic.woff2"
weight = 400
style = "italic"
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/IBMPlexSans-Regular.woff2"
weight = 400
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/IBMPlexSans-SemiBold.woff2"
weight = 600
[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/IBMPlexMono-Regular.woff2"
weight = 400

[server]
enableStaticServing = true
headless = true

[browser]
gatherUsageStats = false

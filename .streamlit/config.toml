# Tempo dashboard theme: grey page, white cards, navy ink, MLH red/blue/yellow accents (tempo/dashboard/theme.py).
# Fonts are self-hosted from tempo/dashboard/static so the venue Wi-Fi cannot block them.
[theme]
base = "light"
primaryColor = "#e73427"
backgroundColor = "#eef0f4"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b1f3a"
linkColor = "#1d539f"
borderColor = "#d9dde5"
dataframeBorderColor = "#e8ebf0"
dataframeHeaderBackgroundColor = "#f6f7fa"
codeBackgroundColor = "#f6f7fa"
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
font = "IBM Plex Sans"
headingFont = "IBM Plex Sans"
codeFont = "IBM Plex Mono"
baseFontSize = 16
headingFontSizes = ["3.6rem", "1.875rem", "1.6rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#1d539f", "#e73427", "#f7931e", "#f2a900"]
greenColor = "#1f9d55"
redColor = "#e73427"
orangeColor = "#c27c00"
blueColor = "#1d539f"
grayColor = "#6b7385"

[[theme.fontFaces]]
family = "Libre Baskerville"
url = "app/static/LibreBaskerville-Regular.woff2"
weight = 400
[[theme.fontFaces]]
family = "Libre Baskerville"
url = "app/static/LibreBaskerville-Bold.woff2"
weight = 700
[[theme.fontFaces]]
family = "Libre Baskerville"
url = "app/static/LibreBaskerville-Italic.woff2"
weight = 400
style = "italic"
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/IBMPlexSans-Regular.woff2"
weight = 400
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/IBMPlexSans-SemiBold.woff2"
weight = 600
[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/IBMPlexMono-Regular.woff2"
weight = 400

[server]
enableStaticServing = true
headless = true

[browser]
gatherUsageStats = false

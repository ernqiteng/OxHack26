[project]
name = "tempo"
version = "0.1.0"
description = "Battery trading for the GB electricity market with a timing audit. OxHack 2026."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=1.26",
  "lightgbm>=4.3",
  "cvxpy>=1.5",
  "scikit-learn>=1.5",
  "python-dotenv>=1.0",
  "streamlit>=1.38",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "joblib>=1.4",
  "apscheduler>=3.10",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "respx>=0.21",
  "freezegun>=1.5",
  "hypothesis>=6.100",
  "ruff>=0.6",
]
nn = ["torch>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: hits real Tiger/Vultr/Elexon; skipped unless TEMPO_LIVE=1",
  "slow: long-running",
]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
include = ["tempo*"]

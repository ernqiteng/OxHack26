# The backend box on port 80.
#   /        the presentation website  (presentation/out, trailing-slash export)
#   /app/    the pitch dashboard        (pitch/out, built with NEXT_PUBLIC_BASE_PATH=/app)
#   /api/    the JSON API               (tempo-api.service on 127.0.0.1:8000)
# Streamlit stays on :8501. Installed by deploy/bootstrap.sh (ROLE=backend).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    absolute_redirect off;  # /app -> /app/ as a relative Location, whatever host or port we're reached on
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;  # the in-process audit replays five shifts (about 12 s)
    }

    location = /app {
        return 301 /app/;
    }

    # Pitch dashboard: /app/data -> /var/www/tempo/app/data.html
    location /app/ {
        root /var/www/tempo;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location /_next/static/ {
        root /var/www/tempo/presentation;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /app/_next/static/ {
        root /var/www/tempo;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /var/www/tempo/presentation;
        try_files $uri $uri/ $uri.html =404;
    }
}
